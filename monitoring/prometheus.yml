# Prometheus pulls metrics from every Flink process. The direction matters: a
# TaskManager that has died simply stops answering, and Prometheus records that
# refusal as up=0. A push-based reporter cannot express the same thing — a
# process that pushes nothing looks identical to one that has no work to do.

global:
  # The replays this pipeline runs last 20-100 seconds, so a 15s default would
  # leave a burst with two or three samples. 5s keeps the shape visible without
  # straining a single-broker, single-TaskManager cluster.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["jobmanager:9249"]

  - job_name: flink-taskmanager
    # Not a static target: Docker's DNS returns one address per running
    # container, and a static host:port would round-robin between TaskManagers
    # once the job is scaled out — each scrape landing on a different machine
    # and the series jumping between them. DNS discovery turns every container
    # into its own target instead, which is what the parallelism work needs.
    dns_sd_configs:
      - names: ["taskmanager"]
        type: A
        port: 9249
        refresh_interval: 10s

  # Reads consumer-group offsets straight from the broker, so it keeps
  # answering after every Flink process is gone. It is the only source here
  # that can still say "the pipeline is not consuming" once Flink cannot say
  # anything at all.
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
