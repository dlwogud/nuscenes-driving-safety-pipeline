services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: on-failure
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    command: standalone-job --job-classname com.example.vehicle.DrivingSafetyJob
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - ./build/driving-safety-job.jar:/opt/flink/usrlib/driving-safety-job.jar
      - ./flink/safety.sql:/opt/flink/sql/safety.sql:ro
      - ./flink/lib/flink-connector-jdbc-3.2.0-1.18.jar:/opt/flink/lib/flink-connector-jdbc-3.2.0-1.18.jar
      - ./flink/lib/flink-sql-connector-kafka-3.2.0-1.18.jar:/opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.18.jar
      - ./flink/lib/postgresql-42.7.3.jar:/opt/flink/lib/postgresql-42.7.3.jar
      - ./checkpoints:/opt/flink/checkpoints
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

  taskmanager:
    image: flink:1.18.1-scala_2.12-java11
    # A resource manager — Kubernetes, YARN — replaces a lost TaskManager so the
    # job's restart strategy has somewhere to run. Compose has no such thing, so
    # the restart policy stands in for it: without it a killed TaskManager leaves
    # the job retrying against zero slots until its attempts run out.
    restart: unless-stopped
    depends_on:
      jobmanager:
        condition: service_started
    command: taskmanager
    volumes:
      - ./build/driving-safety-job.jar:/opt/flink/usrlib/driving-safety-job.jar
      - ./flink/lib/flink-connector-jdbc-3.2.0-1.18.jar:/opt/flink/lib/flink-connector-jdbc-3.2.0-1.18.jar
      - ./flink/lib/flink-sql-connector-kafka-3.2.0-1.18.jar:/opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.18.jar
      - ./flink/lib/postgresql-42.7.3.jar:/opt/flink/lib/postgresql-42.7.3.jar
      - ./checkpoints:/opt/flink/checkpoints
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: vehicle_db
      POSTGRES_USER: flinkuser
      POSTGRES_PASSWORD: flinkpw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flinkuser -d vehicle_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # An observer that is not part of the thing being observed. Flink's own lag
  # metric is published by the Kafka consumer running inside the job, so it
  # disappears exactly when the job does; this reads committed offsets from the
  # broker and survives the cluster it is reporting on.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"

  # The Flink web UI shows the cluster as it is right now, and it is served by
  # the JobManager — so the one moment it is most needed, a crash, is the moment
  # it is gone. These two keep the history outside the thing being watched.
  prometheus:
    image: prom/prometheus:v2.53.0
    depends_on:
      - jobmanager
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Alert rules get edited far more often than Prometheus gets deployed, and
      # restarting to pick them up throws away the series that would show
      # whether the edit was right: `curl -XPOST localhost:9090/-/reload`.
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      # A local, read-only view of a throwaway cluster: a login screen here
      # protects nothing and makes the dashboard harder to open.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
